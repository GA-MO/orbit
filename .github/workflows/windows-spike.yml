name: windows-cdp-spike

on:
  workflow_dispatch:
  push:
    branches: [windows-support]

jobs:
  cdp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun scripts/windows-cdp-spike.ts

  suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: smoke
        run: bun scripts/test.ts smoke
      - name: setup
        run: bun scripts/test.ts setup
      - name: idle
        run: bun scripts/test.ts idle
      - name: ask
        run: bun scripts/test.ts ask
