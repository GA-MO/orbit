# The product page (docs/site/index.html, built by docs/site/build.mjs from
# the template and the screenshots) is what GitHub Pages serves. Only that
# one file goes up: the template and the build script stay in the repo.
name: pages
on:
  push:
    branches: [main]
    paths: ['docs/site/index.html', 'docs/site/th/index.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site/th && cp docs/site/index.html _site/index.html && cp docs/site/th/index.html _site/th/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
