# The gates that run on every push: a typecheck of both workspaces, a build,
# and the suites, on both operating systems Orbit supports. Windows is here
# because everything that broke there broke silently — a 404 for the app
# shell, captures that never answered — and only a suite noticed.
#
#     bash scripts/test.sh all      # macOS, at the desk
#     bun scripts/test.ts all       # either, and what CI runs
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p server
      - run: bunx tsc --noEmit -p web
      - run: bun run build
      - run: bun audit
      # PowerShell reports a syntax error in install.ps1 as a two-line
      # ParserError on the caller's stderr, which the install suite then
      # truncates. Parsing the file on its own says which line and why.
      - name: install.ps1 must parse
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $problems = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$null, [ref]$problems) | Out-Null
          if ($problems) {
            $problems | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'install.ps1 parses'
      - run: bun scripts/test.ts idle
      - run: bun scripts/test.ts ask
      - run: bun scripts/test.ts preview-url
      - run: bun scripts/test.ts install
      - run: bun scripts/test.ts setup
      - run: bun scripts/test.ts smoke
      - run: bun scripts/test.ts touch
      - run: bun scripts/test.ts changes
